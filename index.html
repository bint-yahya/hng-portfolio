  <style>
    /* DESIGN TOKENS */
    :root {
      --bg: #09090E; --surface: #111118; --surface2: #1C1C26;
      --accent: #D4884A; --violet: #A78BFA;
      --text: #E8E2D9; --muted: #9A9AAC; --border: #2A2A38;
      --font-d: 'Playfair Display', Georgia, serif;
      --font-b: 'Inter', system-ui, sans-serif;
      --font-m: 'Space Grotesk', monospace;
    }

    [data-theme="light"] {
      --bg: #F5F2ED; --surface: #EDEAE3; --surface2: #E3DFD6;
      --text: #1A1A22; --accent: #B5621A; --violet: #6D28D9;
      --muted: #5A5A6A; --border: #D0CAC0;
    }

    /* GLOBAL STYLES */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text); font-family: var(--font-b); font-size: 16px; line-height: 1.7; transition: background-color 0.3s ease, color 0.3s ease; cursor: none; overflow-x: hidden; }
    @media (max-width: 1024px) { body { cursor: auto; } }
    h1, h2, h3, h4 { font-family: var(--font-d); font-weight: 600; line-height: 1.2; }
    a { color: inherit; text-decoration: none; transition: color 0.2s; }
    a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    /* CUSTOM CURSOR */
    .custom-cursor { position: fixed; top: 0; left: 0; width: 8px; height: 8px; background-color: var(--accent); border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); transition: width 0.2s, height 0.2s, background-color 0.2s, border 0.2s; }
    .custom-cursor.hover { width: 28px; height: 28px; background-color: transparent; border: 2px solid var(--accent); }
    @media (max-width: 1024px) { .custom-cursor { display: none; } }

    /* LAYOUT & UTILITIES */
    .container { max-width: 1200px; margin: 0 auto; padding: 0 5%; }
    .section { padding: 96px 0; border-bottom: 1px solid var(--border); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 32px; }
    .eyebrow { font-family: var(--font-m); font-size: 12px; letter-spacing: 0.15em; color: var(--accent); text-transform: uppercase; margin-bottom: 12px; display: block; }
    .section-title { font-size: 2.5rem; margin-bottom: 16px; }
    .section-sub { color: var(--muted); font-size: 16px; max-width: 600px; margin-bottom: 48px; }
    .tag { display: inline-block; font-family: var(--font-m); font-size: 12px; padding: 4px 12px; border-radius: 999px; letter-spacing: 0.05em; }
    .tag-accent { background: rgba(212,136,74,0.1); color: var(--accent); border: 1px solid var(--accent); }
    .tag-violet { background: rgba(167,139,250,0.1); color: var(--violet); border: 1px solid var(--violet); }

    /* BUTTONS */
    .btn { display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-m); font-size: 13px; letter-spacing: 0.08em; padding: 14px 28px; border-radius: 8px; cursor: pointer; transition: all 0.2s; min-height: 44px; min-width: 44px; text-align: center; border: none; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-2px); }
    [data-theme="light"] .btn-primary { color: #fff; }
    .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    /* NAVIGATION */
    header { position: fixed; top: 0; width: 100%; z-index: 1000; padding: 24px 0; transition: all 0.3s ease; }
    header.scrolled { background: rgba(var(--bg-rgb), 0.92); backdrop-filter: blur(16px); padding: 16px 0; border-bottom: 1px solid var(--border); }
    .nav-container { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 5%; }
    .logo { font-family: var(--font-d); font-size: 24px; font-style: italic; font-weight: 700; color: var(--accent); min-height: 44px; display: flex; align-items: center; }
    .logo span { font-size: 28px; margin-right: 2px; }
    .nav-links { display: flex; gap: 32px; align-items: center; }
    .nav-links a { font-family: var(--font-m); font-size: 13px; letter-spacing: 0.08em; color: var(--muted); min-height: 44px; display: flex; align-items: center; }
    .nav-links a:hover, .nav-links a.active { color: var(--text); }
    .theme-toggle { background: transparent; border: 1px solid var(--border); color: var(--text); border-radius: 999px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; transition: border 0.2s; }

    .mobile-menu-btn { display: none; background: transparent; border: none; color: var(--text); font-size: 24px; cursor: pointer; min-height: 44px; min-width: 44px; }

    .hero h1 { font-size: clamp(2.5rem, 5vw, 4rem); margin-bottom: 12px; }
    .hero h1 em { color: var(--accent); font-style: italic; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 32px; transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s; }
    .project-card { padding: 0; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; }
    .project-card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(212,136,74,0.1); border-color: rgba(212,136,74,0.5); }
    .project-thumb { height: 220px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1a0f08, #1a1020); }
    /* FIXED WCAG CONTRAST ON THUMBNAILS */
    .project-thumb .watermark { font-family: var(--font-d); font-size: 2rem; color: rgba(255,255,255,0.9); font-weight: 700; letter-spacing: 0.1em; text-shadow: 0 2px 4px rgba(0,0,0,0.5); text-align: center; padding: 0 20px;}
    .project-body { padding: 24px; flex-grow: 1; display: flex; flex-direction: column; }
    .project-link { font-family: var(--font-m); font-size: 12px; color: var(--accent); font-weight: 500; letter-spacing: 0.05em; display: inline-block; margin-top: auto; }

    /* STATS & SKILLS */
    .stat-card { border-left: 4px solid var(--accent); }
    .stat-card .num { font-family: var(--font-d); font-size: 3rem; color: var(--accent); line-height: 1; margin-bottom: 8px; }
    .skills-grid { display: flex; flex-wrap: wrap; gap: 12px; }
    .skill-chip { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); padding: 12px 20px; border-radius: 8px; font-family: var(--font-m); font-size: 13px; }
    
    /* CASE STUDY & BLOG */
    .cs-header { background: var(--surface2); padding: 64px 0; border-bottom: 1px solid var(--border); }
    .cs-content { max-width: 800px; margin: 0 auto; padding: 64px 5%; }
    .cs-content h4 { font-size: 1.5rem; margin: 40px 0 16px; color: var(--accent); }
    .cs-content ul { padding-left: 24px; margin-bottom: 24px; }
    .cs-content li { margin-bottom: 12px; }
    .blog-content { max-width: 680px; margin: 0 auto; padding: 64px 5%; font-size: 18px; line-height: 1.9; }
    
    /* FOOTER & FORMS */
    footer { background: var(--surface); border-top: 1px solid var(--border); padding: 64px 0 32px; }
    .footer-grid { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 48px; margin-bottom: 48px; }
    .form-group { margin-bottom: 24px; }
    .form-control { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); font-family: var(--font-b); font-size: 16px; padding: 14px; border-radius: 8px; }
    textarea.form-control { min-height: 120px; resize: vertical; }

    /* MOBILE RESPONSIVENESS FIXES */

      .section { padding: 64px 0; }

      .hero h1 { font-size: 2.2rem; }
      .footer-grid { grid-template-columns: 1fr; text-align: center; }
      .nav-links { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: var(--bg); flex-direction: column; justify-content: center; align-items: center; gap: 24px; }
      .nav-links.open { display: flex; }
      .mobile-menu-btn { display: block; z-index: 1001; }
      .theme-toggle { position: absolute; top: 24px; left: 24px; }
      .cs-content { padding: 32px 5%; }
    }

    /* ANIMATIONS */
    .reveal { opacity: 1; transform: translateY(0); transition: opacity 0.6s ease-out, transform 0.6s ease-out; }
    .js-active .reveal { opacity: 0; transform: translateY(20px); }
    .reveal.is-visible { opacity: 1 !important; transform: translateY(0) !important; }
    .delay-1 { transition-delay: 0.1s; } .delay-2 { transition-delay: 0.2s; } .delay-3 { transition-delay: 0.3s; }
    @media (prefers-reduced-motion: reduce) { .reveal, .js-active .reveal { opacity: 1; transform: none; transition: none; } }
  </style>
</head>

          title: "The Boring Product Campaign", brand: "OatLabs", category: "Brand Strategy",
          bg: "linear-gradient(135deg, #1a0f08, #1a1020)",
          summary: "Turned oats into a compelling DTC brand with full funnel, 4 ad copies, 3 growth hacks, and a $0→$10K revenue roadmap.",
          html: `
            <div class="cs-header"><div class="container">
                <a href="#/projects" style="font-family: var(--font-m); font-size: 12px; color: var(--muted); margin-bottom: 24px; display: inline-block;">← All Projects</a>
                <br><span class="tag tag-accent" style="margin-bottom: 16px;">BRAND STRATEGY</span>
                <h1 style="font-size: 2.5rem; margin: 16px 0;">The Boring Product Campaign</h1>
                <p style="color: var(--muted);">OatLabs · April 2026 · Stage 2, Marketing Fellowship</p>
            </div></div>
            <div class="cs-content">
              <h4>01 · The Brief</h4>
              <p>Stage 2 of the HNG Marketing Fellowship: select a low-interest, everyday product and build a complete strategy to grow it from $0 to $10K revenue. The task tested the ability to apply core marketing principles to drive growth from scratch. I chose oats — not despite the fact that they're boring, but because of it.</p>
              <h4>02 · My Role & Responsibilities</h4>
              <ul>
                <li><strong>Title:</strong> Brand Strategist & Campaign Designer</li>
                <li>Sole creator — all strategy, copy, and creative direction was developed independently</li>
                <li><strong>Responsibilities:</strong> Brand naming and concept (OatLabs — The Morning Formula™), Customer personas, Full-funnel strategy, Ad copywriting, Email sequence design, Growth hacks, Landing page prototypes, Revenue roadmap.</li>
              </ul>
              <h4>03 · Strategy & Approach</h4>
              <p>Oats have a retention problem. Consumers buy once, get bored, and never come back. The "boring" label became the brand's superpower — because the most powerful brand position is one your competitors are too proud to claim.</p>

              <h4>04 · Execution & Deliverables</h4>
              <ul>
                <li>4 Ad Copies written targeting different segments (oat drop-outs, fitness crowd, busy students).</li>
                <li>3-email sequence designed (Welcome → Nurture → Conversion with urgency).</li>

          excerpt: "When the category is dull, differentiation becomes incredibly easy.",
          content: `
            <p>There is a massive misconception in marketing that it is easier to sell an exciting product. Tech startups spend millions trying to convince the world that their new AI feature is revolutionary. But the truth is, exciting categories are noisy. When everyone is shouting about innovation, nobody is listening.</p>
            <p>This is why boring products are a marketer's dream. When I worked on the OatLabs campaign, the brief was literally "market oats." Oats are the definition of a low-interest category. People buy them out of habit, eat them plain, and forget about them.</p>
            <p>But that boredom is a strategic vacuum. If every other oat brand is competing on "heart health" or "organic farming," all you have to do to stand out is step slightly outside that box. We repositioned oats not as a meal, but as a modular morning system. We called it a "formula." Suddenly, a $3 bag of rolled oats felt like a premium lifestyle choice.</p>
            <p>The lesson here is simple: if your product is boring, lean into it. Don't try to make it fake-exciting. Find the human friction point surrounding the boring product, and brand that instead. The most powerful brand position is often the one your competitors are too proud to claim.</p>

            <p>Acquisition is a marketing problem. Retention is a product problem. Or at least, that is what we are taught to believe. But sometimes, a product fails to retain users simply because the brand failed to teach them how to use it.</p>
            <p>Let's look at everyday staples. The initial purchase is easy—it's driven by a recipe, a diet plan, or a whim. But by day four, the consumer is bored. They abandon the product, not because the product is bad, but because they have exhausted their personal imagination on how to use it.</p>
            <p>During a recent strategy build, I realized that if you want to fix retention, you have to engineer it into the marketing funnel. You cannot just sell the product; you must sell the system of using the product. By mapping out a 7-day "challenge" or "formula," you force the user into a habit loop. By the time they finish the loop, the product is empty, and the repurchase is guaranteed.</p>

            <p>Product-led marketing flips the script. Instead of the marketing department making promises the product has to keep, the product itself becomes the marketing engine. The strategy is the story, and the product is the proof.</p>
            <p>This means marketers need to stop thinking exclusively in terms of ad creatives and start thinking about user flows. How does the free trial experience naturally lead to an upgrade? How does a user's success inherently promote the tool to their network? If your marketing strategy doesn't deeply understand the product mechanics, it's just noise.</p>

                <div class="project-thumb" style="background: ${p.bg}"><span class="watermark">${p.brand}</span></div>
                <div class="project-body"><span class="tag tag-accent" style="align-self: flex-start; margin-bottom: 12px;">${p.category}</span>
                  <h3>${p.title}</h3><p>${p.summary}</p><span class="project-link">View Case Study →</span>
                </div>
              </a>`).join('')}
          </div>
          <div style="text-align: center; margin-top: 48px;" class="reveal"><a href="#/projects" class="btn btn-ghost">View All Projects →</a></div>
        </section>
      `,
      about: () => `
        <section class="section container" style="padding-top: 140px;"><span class="eyebrow reveal">The Story</span><h1 class="section-title reveal">Marketing that makes or mars.</h1>
          <div class="grid-2 reveal delay-1" style="margin-top: 48px;">
            <div><p style="margin-bottom: 24px;">I'm Sumayyaah Bint Yahya — a Sales & Marketing professional who leans toward product-led marketing. I believe the most powerful campaigns aren't the loudest ones. They're the ones that understand what a product is really offering, who it's really for, and what story makes those two things click.</p>
              <p style="margin-bottom: 24px;">What draws me to this work is a conviction I hold tightly: as a marketer, I can make or mar a product. That weight is what makes it interesting. I've spent time building brand strategies, writing ad copy that converts, designing email flows, and developing growth systems — across products as different as oats and fintech.</p>
              <p>I'm currently looking for roles where strategy is taken seriously and execution is celebrated. If you're building something that needs to be understood, positioned, and loved by the right people — let's talk.</p>
            </div>
            <div><div class="card" style="background: rgba(212,136,74,0.05); border-color: var(--accent);"><h3 style="font-size: 1.5rem; font-style: italic; margin-bottom: 16px;">"A marketer can make or mar a product. That weight is what makes this work interesting."</h3></div></div>
          </div>
        </section>
      `,
      projects: () => `
        <section class="section container" style="padding-top: 140px;"><h1 class="section-title reveal">Selected Work</h1><p class="section-sub reveal">Real briefs. Real strategy. Delivered during a competitive marketing fellowship.</p>
          <div class="grid-3 reveal delay-1" style="margin-top: 48px;">
            ${Object.entries(data.projects).map(([slug, p]) => `
              <a href="#/projects/${slug}" class="card project-card">
                <div class="project-thumb" style="background: ${p.bg}"><span class="watermark">${p.brand}</span></div>
                <div class="project-body"><span class="tag tag-accent" style="align-self: flex-start; margin-bottom: 12px;">${p.category}</span>
                  <h3>${p.title}</h3><p>${p.summary}</p><span class="project-link">View Case Study →</span>
                </div>
              </a>`).join('')}
          </div>
        </section>
      `,
      blog: () => `
        <section class="section container" style="padding-top: 140px; min-height: 70vh;"><span class="eyebrow reveal">Insights</span><h1 class="section-title reveal">Marketing thinking.<br>Written down.</h1>
          <div class="grid-3 reveal delay-2" style="margin-top: 48px;">
            ${Object.entries(data.blog).map(([slug, b]) => `
             <a href="#/blog/${slug}" class="card project-card" style="padding: 24px;">
                <span class="tag tag-accent" style="align-self: flex-start; margin-bottom: 12px;">${b.tag}</span>
                <h3 style="margin: 12px 0;">${b.title}</h3>
                <p class="section-sub" style="margin-bottom: 16px; font-size: 14px;">${b.excerpt}</p>
                <span class="project-link">Read Article →</span>
             </a>`).join('')}
          </div>
        </section>
      `,
      cv: () => `
        <section class="section container" style="padding-top: 140px; text-align: center; min-height: 70vh;">
          <h1 class="section-title reveal">Curriculum Vitae</h1>
          <p class="section-sub reveal delay-1" style="margin: 0 auto 48px;">Sumayyaah Bint Yahya · Sales & Marketing Professional</p>
          
          <div class="card reveal delay-2" style="max-width: 800px; margin: 0 auto; padding: 64px 24px; border-color: var(--accent); background: rgba(212,136,74,0.05);">
            <h3 style="margin-bottom: 16px;">CV Document Pending</h3>
            <p style="color: var(--muted); margin-bottom: 32px;">The PDF version of my CV will be uploaded and viewable here shortly.</p>
            <a href="#/" class="btn btn-ghost">← Back to Portfolio</a>
          </div>
        </section>
      `,
      contact: () => `
        <section class="section container" style="padding-top: 140px;"><div class="grid-2"><div class="reveal">
              <h1 class="section-title">Let's Talk.</h1><p class="section-sub">Whether it's a role, a project, or a conversation about marketing — my inbox is open.</p>
              <div style="margin-top: 48px;"><span class="eyebrow">Email</span><a href="mailto:sumayyaahbint@gmail.com" style="font-size: 20px; display: inline-block; margin-bottom: 24px;">sumayyaahbint@gmail.com</a>
                <span class="eyebrow">Social</span><a href="https://www.linkedin.com/in/SumayyaahBintYahya" target="_blank" rel="noopener noreferrer" style="font-size: 20px; display: inline-block; margin-bottom: 48px;">LinkedIn ↗</a><br>
                <a href="#/cv" class="btn btn-primary">View CV</a></div></div>
            <div class="card reveal delay-1"><form action="https://formspree.io/f/YOUR_FORMSPREE_ID" method="POST">
                <div class="form-group"><label class="form-label" for="name">FULL NAME *</label><input type="text" id="name" name="name" class="form-control" required placeholder="Your name"></div>
                <div class="form-group"><label class="form-label" for="email">EMAIL ADDRESS *</label><input type="email" id="email" name="email" class="form-control" required placeholder="your@email.com"></div>
                <div class="form-group"><label class="form-label" for="message">MESSAGE *</label><textarea id="message" name="message" class="form-control" required placeholder="What's on your mind?"></textarea></div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message →</button></form></div>
          </div>
        </section>
      `
    };

    /* --- ROUTER & LOGIC --- */
    const app = document.getElementById('app-root');
    const navLinks = document.getElementById('nav-links');
    const mobileMenuBtn = document.getElementById('mobile-menu-toggle');
    const header = document.getElementById('header');

    function router() {
      const hash = window.location.hash || '#/';
      window.scrollTo(0, 0);
      navLinks.classList.remove('open');
      mobileMenuBtn.innerHTML = '☰';

      document.querySelectorAll('.nav-links a').forEach(a => {
        a.classList.remove('active');
        if (a.getAttribute('href') === hash || (hash.startsWith('#/projects') && a.getAttribute('href') === '#/projects') || (hash.startsWith('#/blog') && a.getAttribute('href') === '#/blog')) {
          a.classList.add('active');
        }
      });

      if (hash === '#/') app.innerHTML = pages.home();
      else if (hash === '#/about') app.innerHTML = pages.about();
      else if (hash === '#/projects') app.innerHTML = pages.projects();
      else if (hash === '#/blog') app.innerHTML = pages.blog();
      else if (hash === '#/cv') app.innerHTML = pages.cv();
      else if (hash === '#/contact') app.innerHTML = pages.contact();
      else if (hash.startsWith('#/projects/')) {
        const slug = hash.replace('#/projects/', '');
        app.innerHTML = data.projects[slug] ? data.projects[slug].html : '<div class="container section" style="padding-top:140px; text-align:center;"><h1>Project Not Found</h1><a href="#/projects" class="btn btn-primary" style="margin-top:24px;">Back to Projects</a></div>';
      }
      else if (hash.startsWith('#/blog/')) {
        const slug = hash.replace('#/blog/', '');
        if(data.blog[slug]) {
          const b = data.blog[slug];
          app.innerHTML = `<div class="cs-header"><div class="container"><a href="#/blog" style="font-family: var(--font-m); font-size: 12px; color: var(--muted); margin-bottom: 24px; display: inline-block;">← Back to Insights</a><br><span class="tag tag-accent mb-4">${b.tag}</span><h1 style="font-size: 2.5rem; margin: 16px 0;">${b.title}</h1><p style="color: var(--muted);">${b.date}</p></div></div><div class="blog-content">${b.content}</div>`;
        } else {
          app.innerHTML = '<div class="container section" style="padding-top:140px; text-align:center;"><h1>Article Not Found</h1><a href="#/blog" class="btn btn-primary" style="margin-top:24px;">Back to Blog</a></div>';
        }
      }
      else app.innerHTML = pages.home();

      initAnimations();
    }

    mobileMenuBtn.addEventListener('click', () => { navLinks.classList.toggle('open'); mobileMenuBtn.innerHTML = navLinks.classList.contains('open') ? '✕' : '☰'; });
    window.addEventListener('scroll', () => { if (window.scrollY > 60) header.classList.add('scrolled'); else header.classList.remove('scrolled'); });

    const themeBtn = document.getElementById('theme-toggle');
    const htmlObj = document.documentElement;
    if (localStorage.getItem('theme') === 'light') { htmlObj.setAttribute('data-theme', 'light'); themeBtn.innerHTML = '☀️'; }
    themeBtn.addEventListener('click', () => {
      if (htmlObj.getAttribute('data-theme') === 'dark') { htmlObj.setAttribute('data-theme', 'light'); localStorage.setItem('theme', 'light'); themeBtn.innerHTML = '☀️'; } 
      else { htmlObj.setAttribute('data-theme', 'dark'); localStorage.setItem('theme', 'dark'); themeBtn.innerHTML = '🌙'; }
    });

    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', (e) => { cursor.style.left = e.clientX + 'px'; cursor.style.top = e.clientY + 'px'; });
    document.addEventListener('mouseover', (e) => { if (e.target.tagName === 'A' || e.target.tagName === 'BUTTON' || e.target.closest('a') || e.target.closest('button')) { cursor.classList.add('hover'); } else { cursor.classList.remove('hover'); } });

    function initAnimations() {
      const reveals = document.querySelectorAll('.reveal');
      const observer = new IntersectionObserver((entries) => { entries.forEach(entry => { if (entry.isIntersecting) { entry.target.classList.add('is-visible'); observer.unobserve(entry.target); } }); }, { threshold: 0.1, rootMargin: "0px 0px -50px 0px" });
      reveals.forEach(el => observer.observe(el));
    }

    window.addEventListener('hashchange', router);
    document.addEventListener('DOMContentLoaded', router);
    if (document.readyState === "complete" || document.readyState === "interactive") { setTimeout(router, 1); }
  </script>
</body>
</html>
